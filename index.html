<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#b3262d">
<meta name="apple-mobile-web-app-title" content="成大乙棒">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>成大棒球 線上觀賽</title>
<style>
:root{
  --bg:#0e0e10; --panel:#161619; --panel2:#1f1f23; --line:#2b2b30; --text:#f2ede4; --muted:#99948c;
  --acc:#b3262d; --acc2:#b3262d; --acc-l:#e0767b; --acc-d:#3d1618; --gold:#efe3c8; --ok:#99948c; --blue:#34343a;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%;}
button{font:inherit;color:inherit;cursor:pointer;}
input,select{font:inherit;}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding-top:var(--safe-t);}

/* ---------- 比分列 ---------- */
.sb{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#0a0a0b;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:44px;}
.sb .sbside{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--acc);white-space:nowrap;}
.sb .sbside.def{background:var(--blue);}
.sb .score{font-size:18px;font-weight:800;letter-spacing:.5px;white-space:nowrap;}
.sb .pill{font-size:13px;background:var(--panel2);padding:2px 8px;border-radius:6px;white-space:nowrap;}
.sb .outs i{display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);margin-right:2px;}
.sb .outs i.on{background:var(--acc);border-color:var(--acc);}
.dia{position:relative;width:30px;height:24px;display:inline-block;}
.dia i{position:absolute;width:9px;height:9px;transform:rotate(45deg);border:1.5px solid var(--muted);}
.dia i.on{background:var(--gold);border-color:var(--gold);}
.dia .b2{left:10px;top:1px;} .dia .b3{left:2px;top:9px;} .dia .b1{left:18px;top:9px;}
.sb .who{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sb .who b{color:var(--text);}
.sb .sp{flex:1;}
.iconbtn.demobtn{font-size:10.5px;font-weight:700;color:var(--muted);background:transparent;border-color:var(--line);min-width:0;height:24px;padding:0 6px;border-radius:6px;opacity:.85;}
.iconbtn.demobtn.on{background:var(--acc);color:#fff;border-color:var(--acc);opacity:1;}
.sponsorbtn{height:32px;padding:0 12px;border-radius:999px;border:0;background:var(--acc);color:#fff;font-weight:800;font-size:13px;white-space:nowrap;animation:spGlow 2.4s ease-in-out infinite;}
@keyframes spGlow{0%,100%{box-shadow:0 0 0 0 #b3262d00;}50%{box-shadow:0 0 0 4px #b3262d55;}}
.spkv{background:var(--panel2);border-radius:10px;padding:2px 12px;margin-bottom:12px;}
.spkv>div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
.spkv>div:last-child{border-bottom:0;}
.spkv span{color:var(--muted);font-size:13px;}
.spkv b{font-size:16px;letter-spacing:.5px;}
.spkv button{height:28px;margin-left:8px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:var(--panel);font-size:12px;font-weight:700;}
.spqr{display:flex;align-items:center;justify-content:center;width:180px;height:180px;margin:0 auto 12px;border-radius:12px;background:#fff;color:#777;font-size:13px;overflow:hidden;}
.spqr img{width:100%;height:100%;object-fit:contain;}
#boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:radial-gradient(circle at 50% 42%,#2a1414,#0a0a0b 70%);transition:opacity .45s ease;}
#boot.hide{opacity:0;pointer-events:none;}
#boot .bootlogo{width:132px;height:132px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #efe3c888,0 0 36px #b3262d99;animation:bootPulse 1.6s ease-in-out infinite;}
#boot .club{font-weight:900;letter-spacing:4px;font-size:18px;color:#f2e6c8;text-align:center;margin-top:-4px;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
#boot .club small{display:block;font-weight:600;letter-spacing:2px;font-size:11px;color:#b9ad95;margin-top:4px;}
#boot .bootbird{width:42px;height:42px;margin-left:10px;image-rendering:pixelated;animation:bootHop .3s ease-in-out infinite alternate;}
@keyframes bootHop{from{transform:translateY(0);}to{transform:translateY(-3px);}}
#boot .bootnote{font-size:11.5px;line-height:1.7;color:#a39c8f;text-align:center;max-width:320px;padding:0 16px;margin-top:6px;}
#boot .t{display:flex;align-items:flex-end;gap:2px;font-weight:900;letter-spacing:3px;font-size:15px;color:#f2e6c8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
#boot .t i{display:inline-block;font-style:normal;animation:bootDot 1.2s infinite;}
#boot .t i:nth-child(2){animation-delay:.2s}#boot .t i:nth-child(3){animation-delay:.4s}
@keyframes bootPulse{50%{transform:scale(1.05);}}
@keyframes bootDot{0%,60%,100%{opacity:.2}30%{opacity:1}}
.iconbtn svg{display:block;margin:auto;}
.iconbtn{background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:8px;min-width:36px;height:34px;padding:0 8px;}

/* ---------- 主版面 ---------- */
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"video side" "chat side";}
.videoWrap{grid-area:video;position:relative;background:#000;aspect-ratio:16/9;max-height:calc(100dvh - 340px);width:100%;justify-self:center;}
.chat{min-height:200px;}
.rpseek{position:absolute;left:0;right:0;top:clamp(48px,12%,72px);bottom:clamp(60px,24%,130px);z-index:2;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.rpflash{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;padding:8px 16px;border-radius:999px;background:#000a;color:#fff;font-weight:800;font-size:15px;opacity:0;transition:opacity .2s;}
.rpflash.on{opacity:1;} .rpflash.l{left:22%;} .rpflash.r{left:78%;}
.videoWrap iframe,.videoWrap #yt{position:absolute;inset:0;width:100%;height:100%;border:0;}
.vph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);background:radial-gradient(circle at 50% 40%,#1d1d21,#07080b);text-align:center;padding:10px;}
.vph b{color:var(--text);font-size:18px;}
.vph{overflow:hidden;gap:6px;}
.vph .vphlogo{width:clamp(56px,14vh,110px);height:clamp(56px,14vh,110px);border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #efe3c866,0 0 30px #b3262d88;}
.vph .club{font-weight:900;letter-spacing:4px;font-size:clamp(13px,2.2vw,18px);color:#f2e6c8;}
.vph .club small{display:block;font-weight:600;letter-spacing:2px;font-size:11px;color:#b9ad95;margin-top:2px;}
.vph .prep{font-weight:900;letter-spacing:3px;font-size:clamp(12px,1.8vw,15px);color:var(--text);margin-top:4px;}
.vph .replaybtn{margin-top:6px;height:28px;padding:0 12px;border-radius:999px;border:1px solid #efe3c866;background:#0006;color:#f2e6c8;font-size:12.5px;font-weight:700;}
.rplist .prow{width:100%;}
.vph .vphsp{margin-top:6px;display:inline-block !important;}
.vphbird{position:absolute;left:70%;top:60%;width:40px;height:40px;image-rendering:pixelated;pointer-events:none;transform:scaleX(var(--dir,1));filter:drop-shadow(0 3px 3px #000a);}
.pill.onl{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--muted);background:transparent;border:1px solid #ffffff22;}
.pill.onl i{width:6px;height:6px;border-radius:50%;background:#3fbf6a;box-shadow:0 0 6px #3fbf6a;}
.camlayer{position:absolute;inset:0;z-index:1;pointer-events:none;}
.camv{position:absolute;inset:0;transition:opacity .15s;background:#000;}
.camv iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.camsel{position:absolute;left:8px;top:8px;z-index:6;display:flex;align-items:center;gap:4px;padding:3px 4px 3px 8px;border-radius:999px;background:#000a;font-size:11.5px;color:#ddd;}
.camsel button{min-width:24px;height:22px;border-radius:999px;border:1px solid #ffffff33;background:transparent;color:#eee;font-weight:700;font-size:12px;cursor:pointer;}
.camsel button.on{background:var(--acc);border-color:var(--acc);color:#fff;}
.camsel button.pend{border-color:var(--gold);}
.vctl{position:absolute;right:8px;bottom:8px;display:flex;gap:6px;z-index:6;}
.vctl button{background:#000a;border:1px solid #fff3;border-radius:8px;height:34px;padding:0 10px;font-size:13px;}
.unmute{position:absolute;left:8px;bottom:8px;z-index:6;background:var(--acc);border:0;border-radius:8px;height:34px;padding:0 12px;font-weight:700;font-size:13px;}
.videoWrap.pseudo{position:fixed;inset:0;z-index:50;max-height:none;aspect-ratio:auto;}
.videoWrap:fullscreen{max-height:none;aspect-ratio:auto;}

/* 彈幕 */
.dm{position:absolute;left:0;right:0;top:0;height:55%;overflow:hidden;pointer-events:none;z-index:5;}
.dm span{position:absolute;left:100%;white-space:nowrap;font-weight:700;font-size:clamp(14px,2.4vw,22px);color:#fff;
  text-shadow:0 0 3px #000,0 0 3px #000,1px 1px 2px #000;will-change:transform;animation:dmfly linear forwards;}
.dm span.sys{color:var(--gold);}
.dm span.rk{color:var(--acc-l);}
.dm span.me{border:1.5px solid #fff8;border-radius:6px;padding:0 6px;}
@keyframes dmfly{from{transform:translateX(0);}to{transform:translateX(calc(-100vw - 100%));}}

/* 橫幅（火箭通知） */
.banner{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:7;background:var(--acc);color:#fff;font-weight:800;
  padding:6px 14px;border-radius:999px;font-size:14px;box-shadow:0 4px 16px #0008;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;animation:bannerIn .25s ease-out;}
@keyframes bannerIn{from{opacity:0;transform:translate(-50%,-8px);}to{opacity:1;transform:translate(-50%,0);}}

/* ---------- 聊天 ---------- */
.chat{grid-area:chat;display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--line);}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:4px;-webkit-overflow-scrolling:touch;}
.msg{font-size:14px;line-height:1.45;word-break:break-word;}
.msg .n{font-weight:700;color:#d6cbb8;margin-right:6px;}
.msg.me .n{color:var(--gold);}
.msg .n{cursor:pointer;}
.at{color:var(--acc-l);font-weight:700;}
.atme{background:var(--gold);color:#111;border-radius:4px;padding:0 3px;}
.msg.tagme{background:#1b1b1f;border-left:3px solid var(--gold);padding:2px 6px;border-radius:4px;}
.dm span.tagme{color:#111;background:var(--gold);border-radius:6px;padding:0 6px;text-shadow:none;}
.chat{position:relative;}
.atpop{position:absolute;left:10px;right:10px;bottom:calc(62px + var(--safe-b));background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:4px;display:flex;flex-direction:column;gap:2px;z-index:20;box-shadow:0 6px 20px #0008;max-height:220px;overflow:auto;}
.atpop[hidden]{display:none;}
.atpop button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:8px;font-size:15px;}
.atpop button:first-child,.atpop button:hover{background:#2a2a2f;}
.msg.sys{color:var(--gold);font-size:13px;}
.msg.rk{color:var(--acc-l);font-weight:700;}
.msg.bot .n{color:#b7b0a5;}
.inbar{display:flex;gap:6px;align-items:center;padding:8px 10px calc(8px + var(--safe-b));border-top:1px solid var(--line);background:var(--panel);}
.inbar input[type=text]{flex:1;min-width:0;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 12px;font-size:16px;}
.inbar .send{height:42px;padding:0 14px;border-radius:10px;border:0;background:var(--acc);font-weight:700;}
.tog{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap;user-select:none;}
.tog input{width:18px;height:18px;}

/* ---------- 側欄（陣容） ---------- */
.side{grid-area:side;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel);}
.sideScroll{flex:1;min-height:0;overflow-y:auto;padding:8px;-webkit-overflow-scrolling:touch;}
.seclink{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px;}
.seclink span{color:var(--acc-l);font-size:11.5px;}
.plpa{margin:0 0 10px;padding:8px 10px;border-radius:10px;background:#1c1c20;}
.plbat{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px;font-size:13.5px;}
.plbat b{font-size:12px;padding:1px 8px;border-radius:999px;background:#2a2a30;}
.plbat b.h,.plbat b.hr{background:var(--acc);color:#fff;}
.plbat b.k{background:#3a1d1f;}
.plbat b.bb{background:#1f2b3a;}
.plps{display:flex;flex-direction:column;gap:4px;}
.plp{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;text-align:left;background:#26262b;border:0;border-radius:8px;padding:6px 8px;color:inherit;font:inherit;font-size:13px;cursor:pointer;}
.plp .pn{color:var(--muted);font-size:11.5px;text-align:center;}
.plp .pc{color:var(--muted);font-size:11.5px;}
.plp.fut{opacity:.32;}
.sec{font-size:12px;color:var(--muted);margin:10px 4px 6px;display:flex;align-items:center;gap:6px;}
.sec:first-child{margin-top:2px;}
.prow{position:relative;display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--panel2);border:1px solid transparent;border-radius:10px;padding:7px 9px;margin-bottom:5px;min-height:48px;overflow:hidden;}
.prow.cur{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc);}
.prow.dim{opacity:.55;}
.prow .ord{width:20px;text-align:center;font-weight:800;color:var(--muted);font-size:13px;}
.prow .num{min-width:30px;font-size:12px;color:var(--muted);}
.prow .nm{font-weight:700;font-size:15px;white-space:nowrap;}
.prow .pos{font-size:11px;color:var(--muted);}
.prow .mid{flex:1;min-width:0;}
.prow .pas{display:flex;gap:3px;flex-wrap:wrap;margin-top:2px;}
.pa{font-size:10.5px;padding:0 5px;border-radius:4px;background:#2a2a2f;color:#d6d0c6;line-height:17px;}
.pa.h{background:var(--acc);color:#fff;} .pa.hr{background:var(--gold);color:#111;} .pa.k{background:var(--acc-d);} .pa.bb{background:#2c2c31;}
.prow .line{font-size:13px;font-weight:700;white-space:nowrap;text-align:right;}
.prow .rk{font-size:11px;color:var(--acc-l);text-align:right;white-space:nowrap;}
.tag{font-size:10px;padding:0 6px;border-radius:999px;line-height:16px;background:#2a2a2f;color:var(--muted);white-space:nowrap;}
.tag.hot{background:var(--acc);color:#fff;} .tag.ok{background:#2c2c31;color:#d9d3c8;}
.rocketFly{position:absolute;left:-60%;top:50%;transform:translateY(-50%);font-size:22px;white-space:nowrap;pointer-events:none;z-index:2;animation:rfly 1.6s cubic-bezier(.3,.1,.3,1) forwards;filter:drop-shadow(0 0 6px var(--acc));}
@keyframes rfly{0%{left:-60%;}100%{left:110%;}}
.prow.glow{animation:glow 1.6s ease-out;}
@keyframes glow{0%{background:var(--acc-d);}100%{background:var(--panel2);}}
.plus{position:absolute;right:10px;top:4px;color:var(--gold);font-weight:800;font-size:14px;animation:plus 1s ease-out forwards;pointer-events:none;}
@keyframes plus{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(-16px);}}
.chatbird{position:absolute;left:70%;bottom:62px;width:42px;height:42px;image-rendering:pixelated;pointer-events:none;z-index:3;transform:scaleX(var(--dir,1));filter:drop-shadow(0 2px 2px #0009);}
.pinmsg{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:6;max-width:92%;padding:6px 14px;border-radius:8px;background:#000b;border:1.5px solid var(--acc);color:#fff;font-weight:800;font-size:clamp(13px,2vw,17px);text-align:center;box-shadow:0 4px 14px #0008;pointer-events:none;}
.pinmsg[hidden]{display:none;}
.bp{border:0;cursor:pointer;}
.bp.on{background:var(--acc);color:#fff;}
.thx{position:fixed;left:0;right:0;top:var(--safe-t);height:44px;z-index:55;background:var(--acc);color:#fff;overflow:hidden;pointer-events:none;box-shadow:0 2px 12px #0008;animation:thxIn .3s ease-out;}
.thx span{position:absolute;top:50%;left:100%;transform:translateY(-50%);white-space:nowrap;font-weight:900;font-size:17px;letter-spacing:.5px;animation:thxRun 9s linear forwards;}
.thx.big{background:#7d1218;}
.thx.big span{font-size:19px;}
@keyframes thxIn{from{transform:translateY(-100%);}to{transform:none;}}
@keyframes thxRun{from{left:100%;transform:translate(0,-50%);}to{left:0;transform:translate(-100%,-50%);}}
.msg.sp{color:var(--acc-l);font-weight:800;}
.spf .fieldrow{margin-bottom:10px;}
.seg{display:flex;gap:6px;margin-top:4px;}
.seg button{flex:1;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-weight:700;}
.seg button.on{background:var(--acc);border-color:var(--acc);color:#fff;}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0 10px;}
.chk input{width:18px;height:18px;accent-color:var(--acc);}
.amts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;}
.amts button{height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:13px;font-weight:700;}
.tierHint{font-size:12.5px;color:var(--acc-l);margin-top:6px;min-height:18px;}
.lastp{cursor:pointer;}
.pdhint{font-size:11.5px;color:var(--acc-l);margin-top:2px;}
.pa[data-act]{cursor:pointer;}
.pa.fut{opacity:.28;}
.pdrow{cursor:pointer;}
.pdgrid{display:flex;gap:16px;justify-content:center;align-items:flex-start;margin:6px 0 10px;flex-wrap:wrap;}
.pdzone{display:flex;flex-direction:column;align-items:center;gap:6px;}
.pdzone small{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.4;}
.mz.big{display:grid;grid-template-columns:repeat(5,18px);grid-template-rows:repeat(5,18px);gap:2px;}
.mz.big i{background:#26262b;border-radius:2px;}
.mz.big i.in{background:#38383f;}
.mz.big i.hit{background:var(--gold);box-shadow:0 0 8px var(--gold);}
.fld{width:112px;height:112px;}
.pdkv{grid-template-columns:repeat(auto-fit,minmax(110px,1fr));}
.pdkv .v{font-size:15px;line-height:1.35;}
#landing{position:fixed;inset:0;z-index:58;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#2a1414,#0b0b0d 70%);padding:calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));overflow-y:auto;}
#landing[hidden]{display:none;}
.lgbox{width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;}
.lgbox.lgwide{max-width:520px;}
.lglogo{width:96px;height:96px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px #efe3c866,0 0 30px #b3262d88;}
.lgclub{font-weight:900;letter-spacing:4px;font-size:16px;color:#f2e6c8;}
.lgclub small{display:block;font-weight:600;letter-spacing:2px;font-size:11px;color:#b9ad95;margin-top:4px;}
.lgbtn{width:100%;padding:12px 10px;border:0;border-bottom:1px solid #efe3c833;background:none;color:#f2e6c8;display:flex;flex-direction:column;gap:3px;align-items:center;cursor:pointer;}
.lgbtn:hover b{color:#fff;}
.lgbtn b{font-size:18px;font-weight:800;letter-spacing:4px;}
.lgbtn span{font-size:11.5px;color:#a39c8f;letter-spacing:1px;}
.lgbtn .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e0767b;margin-right:6px;vertical-align:1px;animation:spGlow 1.4s infinite;}
#lgcontent{width:100%;display:flex;justify-content:center;position:relative;z-index:1;}
.landbird{position:absolute;left:70%;top:70%;width:40px;height:40px;image-rendering:pixelated;pointer-events:none;transform:scaleX(var(--dir,1));filter:drop-shadow(0 3px 3px #000a);z-index:0;}
.lglink{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;padding:6px;}
.lgtitle{font-weight:800;font-size:16px;}
.lglist{width:100%;display:flex;flex-direction:column;gap:8px;max-height:55vh;overflow-y:auto;}
.lgitem{display:flex;align-items:center;gap:10px;width:100%;padding:12px 6px;border:0;border-bottom:1px solid #efe3c826;background:none;color:var(--text);text-align:left;cursor:pointer;}
.lgitem b{flex:1;font-size:15px;}
.lgd{font-size:12px;color:var(--muted);white-space:nowrap;}
.lgp{font-size:12.5px;color:var(--acc-l);white-space:nowrap;}
.freenote{text-align:center;font-size:12px;color:var(--muted);margin-top:8px;}
.spintro{font-size:12.5px;line-height:1.7;color:var(--muted);background:var(--panel2);border-radius:10px;padding:8px 12px;margin:2px 0 10px;}
.spnote{text-align:center;font-weight:800;font-size:15px;line-height:1.6;color:var(--text);margin:2px 0 8px;}
.spdone{font-size:12.5px;color:var(--muted);text-align:center;margin:4px 0 12px;}
.bigbtns.three{grid-template-columns:1fr 1fr 1fr;}
.bigbtns.three button{font-size:14px;}
.secbtn{display:flex;width:calc(100% - 8px);padding:0;font-family:inherit;justify-content:space-between;align-items:center;background:none;border:0;text-align:left;cursor:pointer;}
.secbtn span{font-size:12px;color:var(--muted);font-weight:700;}
.lbs{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.lb{background:var(--panel2);border-radius:10px;padding:8px 10px;font-size:13px;min-width:0;}
.lbt{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px;}
.lb .r{display:flex;align-items:center;gap:4px;padding:2px 0;min-width:0;}
.lb .r .av{width:20px;height:20px;margin-right:2px;}
.lb .lbn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lb [class^=rk]{width:14px;font-weight:800;color:var(--muted);font-size:12px;}
.lb .rk1{color:var(--acc-l);}
.lbe{font-size:12px;}
.rkBoard{background:var(--panel2);border-radius:10px;padding:8px 10px;font-size:13px;}
.lastp{display:flex;gap:10px;align-items:center;background:var(--panel2);border-radius:10px;padding:8px 10px;margin-bottom:4px;}
.lastp .mz{display:grid;grid-template-columns:repeat(5,9px);grid-template-rows:repeat(5,9px);gap:1px;flex:none;}
.lastp .mzw{display:flex;flex-direction:column;align-items:center;gap:3px;flex:none;}
.lastp .mzw small{font-size:10px;line-height:1;color:var(--muted);white-space:nowrap;}
.lastp .mz i{background:#26262b;border-radius:1px;}
.lastp .mz i.in{background:#38383f;}
.lastp .mz i.hit{background:var(--gold);box-shadow:0 0 6px var(--gold);}
.lastp .lt{font-size:14px;line-height:1.4;min-width:0;}
.lastp .lt b{font-size:15px;}
.lastp .res{display:inline-block;font-size:12px;font-weight:700;padding:0 7px;border-radius:999px;margin-left:4px;}
.res.ball{background:#2c2c31;color:#d9d3c8;} .res.str{background:var(--acc-d);color:#f1c6c8;} .res.foul{background:#34343a;color:#ddd;} .res.hit{background:var(--gold);color:#111;} .res.out{background:var(--acc-d);color:var(--text);}
.rkBoard .r{display:flex;justify-content:space-between;padding:2px 0;}

/* ---------- 手機分頁 ---------- */
.mtabs{display:none;}
.mtabs .sponsorbtn{display:none;}
.demobar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 10px;background:#1b1b1f;border-left:3px solid var(--acc);color:var(--text);font-size:12.5px;border-bottom:1px solid var(--line);}
.demobar button{background:#fff2;border:1px solid #fff3;border-radius:6px;height:30px;padding:0 9px;font-size:12.5px;}
.demobar .cap{flex:1;min-width:160px;}

/* ---------- 底部面板（點球員） ---------- */
.sheetBack{position:fixed;inset:0;background:#0009;z-index:60;display:flex;align-items:center;justify-content:center;}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(440px,94vw);max-height:84dvh;overflow-y:auto;padding:16px;}
.sheet h3{margin:0 0 4px;font-size:19px;}
.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:12px;}
.sheet .pintro{background:var(--panel2);border-radius:10px;padding:8px 12px;margin:-4px 0 12px;font-size:14px;line-height:1.5;}
.av{width:24px;height:24px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;background:#3a3a40;flex:none;}
.av.big{width:64px;height:64px;margin:0;}
.phead{display:flex;gap:12px;align-items:center;margin-bottom:4px;}
.phead .sub{margin-bottom:0;}
.hrchip{display:inline-block;vertical-align:middle;margin-left:8px;padding:1px 9px;border-radius:999px;background:var(--acc);color:#fff;font-size:12px;font-weight:800;}
.kv .hl{box-shadow:inset 0 0 0 1.5px var(--acc);}
.kv .hl .v{color:var(--acc-l);}
.sheet .pintro .dept{font-size:12.5px;color:var(--muted);}
.sheet .pintro .intro{font-size:15px;font-weight:700;color:var(--gold);}
.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.bigbtns button{height:60px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:16px;font-weight:700;}
.bigbtns .rocket{background:var(--acc);border:0;}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:6px;margin:10px 0;}
.kv div{background:var(--panel2);border-radius:10px;padding:8px;text-align:center;}
.kv .k{font-size:11px;color:var(--muted);} .kv .v{font-size:19px;font-weight:800;}
.palist{display:flex;flex-direction:column;gap:4px;font-size:14px;}
.palist div{background:var(--panel2);border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;}
.fieldrow{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:13px;color:var(--muted);}
.fieldrow input,.fieldrow select{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 10px;font-size:16px;}
.btn{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);padding:0 14px;font-weight:700;}
.btn.pri{background:var(--acc);border-color:var(--acc);}
.row{display:flex;gap:8px;flex-wrap:wrap;}
.muted{color:var(--muted);font-size:12px;}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:999px;font-size:13px;z-index:80;}

/* ---------- 手機直拿／平板直拿 ---------- */
@media (max-width: 899px){
  .pill.onl .ot{display:none;}
  .main{display:flex;flex-direction:column;}
  .videoWrap{max-height:none;flex:none;}
  .mtabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel);}
  .mtabs button{flex:1;height:40px;background:none;border:0;border-bottom:2px solid transparent;font-weight:700;color:var(--muted);}
  .mtabs button.sel{color:var(--text);border-bottom-color:var(--acc);}
  .side{border-left:0;flex:1;}
  .chat{flex:1;border-top:0;}
  .main[data-tab="lineup"] .chat .msgs{display:none;}
  .main[data-tab="lineup"] .chatbird{display:none;}
  .main[data-tab="lineup"] .chat{flex:none;}
  .main[data-tab="chat"] .side{display:none;}
  .sb{gap:6px;padding:5px 8px;}
  .sb .score{font-size:16px;}
  .sb .pill{padding:2px 6px;font-size:12px;}
  .sb .iconbtn{position:absolute;right:8px;top:5px;}
  .sb .iconbtn.demobtn{right:50px;top:10px;}
  .sb .iconbtn.homebtn{right:92px;}
  .sb{padding-right:134px !important;}
  .vph{gap:3px;padding:6px;}
  .vph .vphlogo{width:58px;height:58px;}
  .vph .club{font-size:12.5px;letter-spacing:3px;}
  .vph .club small{font-size:10px;}
  .vph .prep{font-size:11.5px;letter-spacing:2px;}
  .vph .vphsp{display:none !important;}
  .vctl{right:6px;bottom:6px;gap:4px;}
  .vctl button{height:28px;font-size:12px;padding:0 8px;}
  .sb{position:relative;padding-right:92px;}
  .sb .sponsorbtn{display:none;}
  .mtabs .sponsorbtn{display:block;flex:none;height:30px;margin:5px 8px 5px 4px;padding:0 12px;border-radius:999px;background:var(--acc);color:#fff;border:0;}
  .sb .who{flex-basis:100%;}
  .demobar{padding:4px 8px;gap:4px;}
  .demobar .cap{flex-basis:100%;order:9;font-size:11.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .demobar button{height:28px;}
}
/* ---------- 手機橫拿 ---------- */
@media (max-height: 520px) and (orientation: landscape){
  .sb .who{display:none;}
  .main{display:grid;grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"video side" "video chat";}
  .videoWrap{aspect-ratio:auto;height:100%;max-height:none;}
  .mtabs{display:none;}
  .main .side{display:flex !important;}
  .chat{max-height:36vh;border-left:1px solid var(--line);}
  .demobar .cap{display:none;}
  .main .chat .msgs{display:flex !important;}
}
</style>
</head>

/* 小鳥：聊天室底部一隻（左右跑）；沒有直播時播放區一隻（整個畫面跑）。
   跑來跑去、停下來啄地／探頭／揮手／踢腳，久了打瞌睡；有人刷火箭會嚇一跳，有人留言會揮手 */
var BIRDS={chatbird:{x:null,y:null,tx:null,ty:null,act:'run',until:0,f:0,area:false}, vphbird:{x:null,y:null,tx:null,ty:null,act:'run',until:0,f:0,area:true}, landbird:{x:null,y:null,tx:null,ty:null,act:'run',until:0,f:0,area:true}};
function birdDo(act, ms, id){ Object.keys(BIRDS).forEach(function(k){ if(id&&k!==id) return; var b=BIRDS[k]; b.act=act; b.until=Date.now()+ms; b.f=0; }); }
function birdPick(b, el){
  var r=Math.random(), size=el.offsetWidth||42, W=el.parentNode.clientWidth-size-4, H=el.parentNode.clientHeight-size-4;
  if(r<(b.area?0.55:0.42)){ b.tx=Math.max(4,Math.random()*W); if(b.area) b.ty=Math.max(4,Math.random()*H); b.act='run'; return; }
  var now=Date.now(); b.f=0;
  if(r<0.66){ b.act='peck'; b.until=now+2400; } else if(r<0.76){ b.act='peek'; b.until=now+2200; } else if(r<0.84){ b.act='wave'; b.until=now+1600; } else if(r<0.92){ b.act='kick'; b.until=now+700; } else { b.act='nap'; b.until=now+7000; }
}
function birdTick(){
  if(document.hidden) return;
  Object.keys(BIRDS).forEach(function(id){
    var el=document.getElementById(id), b=BIRDS[id]; if(!el||!el.offsetParent){ b.x=null; return; }
    var size=el.offsetWidth||42, W=el.parentNode.clientWidth-size-4, H=el.parentNode.clientHeight-size-4; if(W<20) return;
    if(b.x==null){ b.x=W*0.7; b.tx=b.x; b.y=b.area?H*0.6:0; b.ty=b.y; }
    b.f++; var fr;
    if(b.act==='run'){
      var dx=b.tx-b.x, dy=b.area?(b.ty-b.y):0, d=Math.sqrt(dx*dx+dy*dy), sp=b.area?7:5;
      if(d<3){ b.x=b.tx; if(b.area) b.y=b.ty; birdPick(b, el); }
      else { b.x+=dx/d*Math.min(d,sp); if(b.area) b.y+=dy/d*Math.min(d,sp); if(Math.abs(dx)>1) el.style.setProperty('--dir', dx<0?'-1':'1'); }
      fr=b.f%2?'run_1':'run_2';
    } else {
      var slow=b.act==='nap'?4:2; fr=b.act+'_'+(Math.floor(b.f/slow)%2+1); if(!BIRD[fr]) fr=b.act+'_1';
      if(Date.now()>b.until) birdPick(b, el);
    }
    el.style.left=Math.round(b.x)+'px'; if(b.area) el.style.top=Math.round(b.y)+'px';
    var src=BIRD[fr]; if(src&&el.getAttribute('src')!==src) el.src=src;
  });
}
setInterval(birdTick, 150);
setInterval(function(){ var b=document.getElementById('bootbird'); if(b) b.src=b.src===BIRD.run_1?BIRD.run_2:BIRD.run_1; }, 150);
function birdReact(kind){ if(kind==='rocket') birdDo('startled',1200); else if(kind==='chat') birdDo('wave',1400); }
/* ===== 球隊指令：暱稱是「成大乙棒2015」的訊息就當成指令 =====
   牛棚狀態：#18 顏辰峻，熱身中；#8 黃子承，熱身中   → 牛棚清單
   牛棚狀態：#18 顏辰峻，解除熱身                      → 從清單移除
   臨時狀況：XXXX                                       → 播放區固定彈幕
   臨時狀況解除（或 臨時狀況：解除）                    → 取消固定彈幕
   指令訊息不會出現在聊天室和彈幕。 */
var TEAM_NAME='成大乙棒2015';
function isCmd(m){ return m&&m.kind==='chat'&&m.from===TEAM_NAME&&(/^\s*(牛棚狀態|臨時狀況)/.test(m.text||'')||/^\.\d$/.test(m.text||'')); }
function applyCmd(m){
  if(!S.bullpen) S.bullpen={};
  var t=String(m.text||'').trim();
  if(/^\.\d$/.test(String(m.text||''))){ if(S.mode!=='replay'&&!S.bulk) camSwitch(+t.slice(1)-1, true); return; }
  if(/^臨時狀況\s*[：:]?\s*解除\s*$/.test(t)) S.alert=null;
  else if(/^臨時狀況\s*[：:]/.test(t)) S.alert=t.replace(/^臨時狀況\s*[：:]\s*/,'').trim()||null;
  else if(/^牛棚狀態/.test(t)){
    t.replace(/^牛棚狀態\s*[：:]?\s*/,'').split(/[；;\n]+/).forEach(function(seg){
      var mm=seg.trim().match(/^#?\s*(\d+)?\s*([^，,\s#]+)\s*[，,、\s]\s*(.+)$/); if(!mm) return;
      var name=mm[2], st=mm[3].trim();
      if(/解除|結束|停止|取消|下場/.test(st)) delete S.bullpen[name]; else S.bullpen[name]={num:mm[1]||'', st:st, t:m.t||Date.now()};
    });
  }
  renderAlert(); renderSide();
}
function renderAlert(){ var el=document.getElementById('pinmsg'); if(!el) return; if(S.alert){ el.textContent='臨時狀況：'+S.alert; el.hidden=false; } else { el.hidden=true; el.textContent=''; } }
/* 自動更新：加到主畫面的 App 不會自己重新整理；開啟或切回來時檢查網站有沒有新版，有就重新載入 */
var BUILD='20261122180001';
function checkUpdate(){ if(BUILD.indexOf('__')===0) return;
  fetch(location.pathname+'?chk='+Date.now(),{cache:'no-store'}).then(function(r){ return r.ok?r.text():''; }).then(function(t){
    var m=t.match(/var BUILD='([0-9]+)'/); if(m&&m[1]!==BUILD){ var q=new URLSearchParams(location.search); q.set('b',m[1]); location.replace(location.pathname+'?'+q.toString()+location.hash); }
  }).catch(function(){}); }
document.addEventListener('visibilitychange',function(){ if(!document.hidden) checkUpdate(); });
setTimeout(checkUpdate, 4000); setInterval(checkUpdate, 10*60*1000);

function wantReplay(){ return QS.get('replay')||''; }
function replayT0(){ var m=S.replay&&S.replay.meta; return m?(+m.t0||0)-(+m.adj||0)*1000:0; }   /* adj：紀錄太早出現就填正數（秒） */
function replayVideoSec(ts){ var m=S.replay&&S.replay.meta; if(!m||!ts) return null; return (ts-replayT0())/1000; }

function replayState(G, n){

function replayTeams(G, n){
  var T=JSON.parse(JSON.stringify(G.teams||{})), ev=G.events||[];
  for(var i=ev.length-1;i>=n;i--){ var e=ev[i]; if(e.type!=='sub'||!e.inPlayerName||!e.outPlayerName) continue;
    var t=T[subTeam(e)]; if(!t) continue; t.lineup=t.lineup||[]; t.bench=t.bench||[];
    var all=t.lineup.concat(t.bench).filter(Boolean);
    var inP=all.find(function(q){ return q.name===e.inPlayerName; })||{name:e.inPlayerName};
    var outP=all.find(function(q){ return q.name===e.outPlayerName; })||{name:e.outPlayerName};
    var k=-1; t.lineup.forEach(function(q,j){ if(q&&q.name===e.inPlayerName) k=j; });
    if(k>=0){ var slot=t.lineup[k], o=JSON.parse(JSON.stringify(outP));
      o.pos=/投手/.test(e.kind||'')?'P':(/守備/.test(e.kind||'')&&e.position?e.position:(outP.pos||slot.pos));
      t.lineup[k]=o; }
    if(/投手/.test(e.kind||'')&&outP.id&&(t.pitcherId===inP.id||!t.pitcherId)) t.pitcherId=outP.id;

  }

function teamPitcher(t){ if(!t) return null; return (t.lineup||[]).find(function(p){return p.pos==='P';}) || (t.pitcherId?(t.bench||[]).find(function(p){return p.id===t.pitcherId;}):null) || null; }
function ourSides(g){
  var o={};
  ['home','away'].forEach(function(sd){
    var t=g.teams[sd]||{}, nm=t.name||'';
    var hit=(t.lineup||[]).filter(function(p){return NCKU_NAMES.indexOf(p.name)>=0;}).length;
    if(/成大|我方|NCKU/i.test(nm) || hit>=4) o[sd]=true;

}
function subSide(e){ return e.fieldingTeam || (e.halfBefore==='top'?'home':'away'); }
/* 換人屬於哪一隊：代打、代跑是進攻方；投手更換、守備更換是守備方 */
function subTeam(e){ if(e.team==='home'||e.team==='away') return e.team; if(/代打|代跑/.test(e.kind||'')) return e.battingTeam||(e.halfBefore==='top'?'away':'home'); return subSide(e); }

function paOut(e){
  if(e.type==='pitch'){ var f=e.finalOutcome; if(f==='BB') return 'BB'; if(f==='HBP') return 'HBP'; if(f==='三振看'||f==='三振揮') return 'K'; return null; }

  if(HITS.indexOf(o)>=0||o==='ROE'||o==='SF'||o==='SH') return o;
  return 'OUT';
}
function normGame(g){
  var our=ourSides(g), recs=[], pc={}, cur={};
  var subs=g.events.filter(function(e){return e.type==='sub'&&e.kind==='投手更換';});
  ['home','away'].forEach(function(sd){
    var first=subs.find(function(e){return subSide(e)===sd&&e.outPlayerName;}), tp=teamPitcher(g.teams[sd]);
    cur[sd]=first?first.outPlayerName:(tp?tp.name:'');
  });
  g.events.forEach(function(e,i){
    if(e.type==='sub'&&e.kind==='投手更換'){ cur[subSide(e)]=e.inPlayerName; return; }
    if((e.type!=='pitch'&&e.type!=='battedball') || !e.fieldingTeam || !e.battingTeam) return;
    if(e.pitcherName) cur[e.fieldingTeam]=e.pitcherName;
    var pit=cur[e.fieldingTeam]||'', bat=e.batterName||'';
    pc[pit]=(pc[pit]||0)+1;
    var end=e.type==='battedball'||!!e.finalOutcome||!!e.paEnd;
    recs.push({ei:i, gid:g.id, pit:pit, bat:bat, ourPit:!!our[e.fieldingTeam], ourBat:!!our[e.battingTeam], inn:e.inningBefore||1, half:e.halfBefore,
      res:e.type==='battedball'?'inplay':e.pitchResult, paEnd:end, out:end?paOut(e):null, traj:e.trajectory||'', bp:g.sessionType==='liveBP'});
  });
  return {our:our, recs:recs};
}

function M(rs){

    if(r.paEnd&&r.out){ var o=r.out; m.pa++; if(o==='K') m.k++; else if(o==='BB') m.bb++; else if(o==='HBP') m.hbp++;
      if(HITS.indexOf(o)>=0) m.h++; if(o==='HR') m.hr++; if(['BB','HBP','SF','SH'].indexOf(o)<0) m.ab++; if(o==='SF') m.sf++; } });
  return m;

/* ===== 現在場上的打序：依逐球紀錄推算（不只看紀錄檔裡的先發名單） =====
   - 每個棒次＝這一棒最近一次實際上來打擊的人；有代打／換人就換成新上場的人
   - 有「換下誰」的換人紀錄（代打、代跑、守備更換）也會直接替換
   - 被換下的人列為已退場；ptr＝目前打擊中（或下一位）是第幾棒 */
var LU_CACHE={};
function liveLineup(g, side){
  var key=g.id+'|'+side+'|'+g.events.length+'|'+JSON.stringify(((g.teams||{})[side]||{}).lineup||[]).length;
  if(LU_CACHE[key]) return LU_CACHE[key];
  var t=(g.teams||{})[side]||{}, base=(t.lineup||[]).filter(Boolean), bench=t.bench||[];
  var lu=base.map(function(p){ return {name:p.name, pos:p.pos, id:p.id, number:p.number}; }), n=lu.length||9, out={}, seen=false, ptr=0, open=null;
  function info(name){ return base.concat(bench).find(function(q){ return q&&q.name===name; })||{}; }
  function put(i, name, pos){
    var old=lu[i]; if(old&&old.name===name) return;
    if(old&&old.name) out[old.name]=1; delete out[name];
    lu.forEach(function(q,j){ if(j!==i&&q&&q.name===name) lu[j]=null; });   /* 同一人不重複出現 */
    var q=info(name); lu[i]={name:name, pos:pos||(old&&old.pos)||q.pos||'', id:q.id, number:q.number};
  }
  (g.events||[]).forEach(function(e){
    if(e.type==='sub'&&e.inPlayerName&&subTeam(e)===side){
      var j=-1; lu.forEach(function(q,k){ if(q&&e.outPlayerName&&q.name===e.outPlayerName) j=k; });
      if(j>=0) put(j, e.inPlayerName, e.position||(/代打/.test(e.kind||'')?'PH':(/代跑/.test(e.kind||'')?'PR':'')));
      else if(lu.some(function(q){ return q&&q.name===e.inPlayerName; })) lu.forEach(function(q){ if(q&&q.name===e.inPlayerName&&e.position) q.pos=e.position; });
      else if(e.position&&e.position!=='P'){ var js=[]; lu.forEach(function(q,k){ if(q&&q.pos===e.position) js.push(k); }); if(js.length===1) put(js[0], e.inPlayerName, e.position); }   /* 沒寫換下誰：依守位替換 */
      return;
    }
    if(e.battingTeam!==side||!e.batterName) return;
    if(!seen){ seen=true; var f=-1; lu.forEach(function(q,k){ if(q&&q.name===e.batterName) f=k; }); ptr=f>=0?f:0; }
    if(!open||open!==e.batterName){ put(ptr, e.batterName); open=e.batterName; }
    if(e.finalOutcome){ open=null; ptr=(ptr+1)%n; }
  });
  if(!seen){ var bi=((g.state||{}).battingIndex||{})[side]; ptr=(bi!=null&&bi>=0)?bi:-1; }
  return (LU_CACHE[key]={lineup:lu, ptr:ptr, out:out, derived:seen});
}
function situation(){

  if(our.away&&our.home) ourSide=fld;

  var sc={}; ['home','away'].forEach(function(sd){ sc[sd]=((st.score||{})[sd]||[]).reduce(function(a,b){return a+(b||0);},0); });
  return {g:g, st:st, batSide:bat, fldSide:fld, ourSide:ourSide, weBat:bat===ourSide, batter:batter, pitcher:teamPitcher(g.teams[fld]), bases:baseCode(st.bases), score:sc,
    names:{home:(g.teams.home||{}).name||'主隊', away:(g.teams.away||{}).name||'客隊'}};

function startDemo(){
  var d=demoData(); if(!d){ toast('這個版本沒有內嵌 DEMO 資料'); return; }
  var oldYt=curYt(); stopAll(); S.mode='demo'; S.hist=d.hist; S.demo={i:0, frames:d.frames}; S.lastEvN=-1;
  if(curYt()!==oldYt){ var app=document.getElementById('app'); app.dataset.built=''; S.yt=null; }
  startBots(); applyFrame(); if(hasFrameT()) startAuto();

function applyFrame(){
  var d=demoData(), fr=S.demo.frames[S.demo.i], g=JSON.parse(JSON.stringify(d.base));
  for(var k=0;k<=S.demo.i;k++){ var f=S.demo.frames[k]; (f.events||[]).forEach(function(e){ g.events.push(e); }); if(f.teams) g.teams=JSON.parse(JSON.stringify(f.teams)); }
  g.state=fr.state; setGame(g); demoSeek();
}
/* 新比賽資料進來：重建模型，並把「新發生的事件」變成系統訊息（每個分頁自己算，不需要廣播） */
function setGame(g){
  var prevN=S.lastEvN, sameGame=S.cur&&S.cur.id===g.id;
  S.cur=g; buildModel();
  if(!sameGame&&S.mode==='replay'){ /* 重播：聊天由 replayTick 依時間餵入 */ }
  else if(!sameGame){ if(fbOn()){ S.log=[]; S.seen={}; connectRoom(); } else { S.log=loadJSON(logKey(),[]); S.seen={}; S.log.forEach(function(m){ S.seen[m.id]=1; }); } }
  if(sameGame && prevN>=0 && g.events.length>prevN) announce(g, prevN);
  S.lastEvN=g.events.length;
  render();
}
function announce(g, from){
  var x=situation(); if(!x) return;
  for(var i=from;i<g.events.length;i++){
    var e=g.events[i];
    if(e.type==='sub'){ var ourSub=subTeam(e)===x.ourSide;
      if(e.inPlayerName) sysMsg((ourSub?'成大':'對手')+(e.kind||'換人')+'：'+e.inPlayerName+(e.outPlayerName?'（換下 '+e.outPlayerName+'）':''), false); continue; }
    var r=S.model.today.find(function(q){return q.ei===i;}); if(!r||!r.paEnd||!r.out) continue;
    var ours=r.ourBat, big=HITS.indexOf(r.out)>=0||r.out==='HR';
    if(ours) sysMsg((r.out==='HR'?'全壘打｜':(big?'':'· '))+r.bat+' '+outLabel(r)+(r.out==='HR'?'！！':(big?'！':'')), big);
    else if(r.ourPit && r.out==='K') sysMsg(r.pit+' 三振 '+r.bat+'！', true);
  }
}

/* ================= 聊天室＋多人同步 =================
   有設定 config.json 的 fb（Firebase Realtime Database 網址）→ 所有裝置即時同步（REST 寫入＋EventSource 串流，不需要 SDK 和金鑰）。
   沒設定 → 退回 BroadcastChannel，只同步同一台電腦的分頁。
   房間：正式比賽用 gameId；DEMO 共用 demo 房間，方便多支手機一起測。 */
var bc=null; try{ bc=new BroadcastChannel('ncku_live_v1'); }catch(e){}
S.room={state:'off', es:null, key:null};
function fbBase(){ return String(S.site.fb||DEFAULT_FB).replace(/\/+$/,''); }
function fbOn(){ return !!fbBase(); }
function roomKey(){ if(!S.cur) return null; return (S.mode==='demo'?'demo':String(S.cur.id)).replace(/[.#$\[\]\/]/g,'_'); }
function connectRoom(){
  var key=roomKey(); if(!fbOn()||!key) return; if(S.room.es&&S.room.key===key) return;
  if(S.room.es){ try{ S.room.es.close(); }catch(e){} }
  S.room={state:'connecting', es:null, key:key}; S.bullpen={}; S.alert=null; renderAlert();
  var es; try{ es=new EventSource(fbBase()+'/live/'+key+'/log.json?orderBy=%22%24key%22&limitToLast=5000'); }catch(e){ S.room.state='err'; return; }
  S.room.es=es;
  function take(d, quiet){ if(!d||typeof d!=='object') return;
    if(d.path==='/'){ if(d.data&&typeof d.data==='object'){ S.bulk=true; try{ Object.keys(d.data).sort().forEach(function(k){ var m=d.data[k]; if(m&&m.id) receive(m,false,quiet); }); } finally{ S.bulk=false; }
        var box=document.getElementById('msgs'); if(box){ box.innerHTML=S.log.slice(-200).map(function(m){ return msgHTML(m,false); }).join(''); box.scrollTop=box.scrollHeight; } renderSide(); } }
    else if(d.data&&d.data.id) receive(d.data,false,quiet); }
  var first=true;
  es.addEventListener('put',function(ev){ if(S.room.key!==key) return; S.room.state='on'; var d; try{ d=JSON.parse(ev.data); }catch(e){ return; } take(d, first&&d.path==='/'); first=false; });
  es.addEventListener('patch',function(ev){ if(S.room.key!==key) return; var d; try{ d=JSON.parse(ev.data); }catch(e){ return; } if(d&&d.data) Object.keys(d.data).forEach(function(k){ take({path:'/'+k,data:d.data[k]},false); }); });
  es.addEventListener('cancel',function(){ S.room.state='err'; });
  es.onerror=function(){ if(S.room.key===key&&S.room.state!=='on') S.room.state='err'; };
}
function logKey(){ return 'live_log_'+(S.cur?S.cur.id:'none'); }
function uidm(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function publish(m){
  if(S.mode==='replay'){ if(m.kind==='support'){ receive(m,true); } else toast('重播中不能留言或刷火箭'); return; }
  receive(m,true);
  if(fbOn()&&roomKey()){ var body={id:m.id, kind:m.kind, from:m.from, t:m.t}; ['text','to','g','dept','alum','tier'].forEach(function(k){ if(m[k]!=null) body[k]=m[k]; });
    fetch(fbBase()+'/live/'+roomKey()+'/log.json',{method:'POST',body:JSON.stringify(body)}).then(function(r){ if(!r.ok) toast('送出失敗，請稍後再試'); }).catch(function(){ toast('網路不穩，送出失敗'); });
    return; }
  if(bc) bc.postMessage({gid:S.cur?S.cur.id:'', m:m});
}
if(bc) bc.onmessage=function(ev){ var d=ev.data||{}; if(!S.cur||d.gid!==S.cur.id) return; receive(d.m,false); };
function receive(m, mine, quiet){
  if(!m||!m.id||S.seen[m.id]) return; S.seen[m.id]=1;
  if(isCmd(m)){ applyCmd(m); return; }
  if(m.kind==='chat'&&typeof m.text!=='string') return; if(m.kind==='rocket'&&typeof m.to!=='string') return; if(m.kind==='support'&&!(m.tier>=1&&m.tier<=3)) return;
  if(m.kind==='rocket') rkAdd(m);
  S.log.push(m); if(S.log.length>300) S.log=S.log.slice(-300);
  if(!fbOn() && m.kind!=='sys' && m.kind!=='bot') saveJSON(logKey(), S.log.filter(function(x){return (x.kind==='chat'||x.kind==='rocket')&&!x.bot;}));   /* 沒有雲端時才存本機；DEMO 模擬觀眾的訊息不存 */
  if(S.bulk) return;   /* 一次載入大量舊訊息：最後再一起畫 */
  appendMsg(m, mine);
  if(quiet){ if(m.kind==='rocket') renderSide(); return; }   /* 剛進房間載入的舊訊息：只列出，不播特效 */
  if(m.kind==='support'){ scheduleThanks(m); return; }
  birdReact(m.kind);
  if(m.kind==='rocket'){ renderSide(); rocketFx(m.to, m.from); fly(m.from+' 🚀 '+m.to, 'rk'); }   /* 先更新列表再播動畫，動畫才不會被重畫蓋掉 */
  else if(m.kind==='chat'||m.kind==='bot'){ var tm=mentionsMe(m); fly(m.text, mine?'me':(tm?'tagme':'')); if(tm){ toast(m.from+' 提到你'); try{ if(navigator.vibrate) navigator.vibrate(60); }catch(e){} } }
}

function mentionsMe(m){ if(!m||m.kind!=='chat'||m.from===myName()) return false; return new RegExp('@'+escRe(myName())+'(?![^\\s@])').test(m.text||''); }
function richText(t){ var me=myName(); return esc(t).replace(/@([^\s@<>&"]{1,12})/g,function(all,n){ return '<span class="at'+(n===me?' atme':'')+'">@'+n+'</span>'; }); }
function atNames(q){ var seen={}, out=[], me=myName(); for(var i=S.log.length-1;i>=0;i--){ var f=S.log[i].from; if(!f||f===me||seen[f]) continue; seen[f]=1; if(!q||f.indexOf(q)>=0) out.push(f); if(out.length>=6) break; } return out; }
function atOpen(){ var p=document.getElementById('atpop'); return !!(p&&!p.hidden&&p.childElementCount>0); }
function hideAt(){ var p=document.getElementById('atpop'); if(p){ p.hidden=true; p.innerHTML=''; } }
function atQuery(inp){ var pos=inp.selectionStart==null?inp.value.length:inp.selectionStart; var m=/@([^\s@]*)$/.exec(inp.value.slice(0,pos)); return m?{q:m[1],start:pos-m[0].length,end:pos}:null; }
function updateAt(){ var inp=document.getElementById('chat-in'), p=document.getElementById('atpop'); if(!inp||!p) return; var a=atQuery(inp); if(!a){ hideAt(); return; }
  var ns=atNames(a.q); p.hidden=false;
  if(!ns.length){ p.innerHTML='<div class="muted" style="padding:8px 10px">'+(S.log.length?'找不到「'+esc(a.q)+'」':'還沒有人留言，等有人說話就能 @ 他')+'</div>'; return; }

function pickAt(name){ var inp=document.getElementById('chat-in'); if(!inp) return; var a=atQuery(inp); var v=inp.value;
  if(a){ inp.value=v.slice(0,a.start)+'@'+name+' '+v.slice(a.end); var c=a.start+name.length+2; try{ inp.setSelectionRange(c,c); }catch(e){} } else { insertAt(name); return; }

function insertAt(name){ if(!name||name===myName()) return; var inp=document.getElementById('chat-in'); if(!inp) return; var v=inp.value; inp.value=(v&&!/\s$/.test(v)?v+' ':v)+'@'+name+' '; inp.focus(); var c=inp.value.length; try{ inp.setSelectionRange(c,c); }catch(e){} hideAt(); }

function appendMsg(m, mine){
  var box=document.getElementById('msgs'); if(!box) return;
  var stick=box.scrollHeight-box.scrollTop-box.clientHeight<60;
  box.insertAdjacentHTML('beforeend', msgHTML(m, mine));
  while(box.children.length>200) box.removeChild(box.firstChild);
  if(stick||mine) box.scrollTop=box.scrollHeight;
}

/* ================= 彈幕 ================= */
var lanes=[];
function fly(text, cls){
  if(!S.dmOn) return; var layer=document.getElementById('dm'); if(!layer) return;
  var h=layer.clientHeight||200, lh=Math.max(26, Math.min(34, h/6)), n=Math.max(3, Math.min(9, Math.floor(h/lh)));
  if(layer.childElementCount>=n*2) return;   /* 太多就丟掉，避免擋畫面、手機卡頓 */
  var now=Date.now(), best=0, bt=Infinity; for(var i=0;i<n;i++){ var t=lanes[i]||0; if(t<bt){ bt=t; best=i; } }
  lanes[best]=now+1600;
  var s=document.createElement('span'); s.className=cls||''; s.textContent=text;
  var w=layer.clientWidth||600; s.style.top=(best*lh+4)+'px'; s.style.animationDuration=Math.max(5.5, Math.min(9, w/110))+'s';
  s.addEventListener('animationend', function(){ s.remove(); }); layer.appendChild(s);
}

    row.classList.remove('glow'); void row.offsetWidth; row.classList.add('glow');

    var p=document.createElement('div'); p.className='plus'; p.textContent='+1 🚀'; row.appendChild(p);
    setTimeout(function(){ r.remove(); p.remove(); }, 1700);

/* 火箭總數：每收到一個火箭就累加（不受聊天室只保留最近 300 則的限制） */

  var to={}, from={}; S.log.forEach(function(m){ if(m.kind==='rocket'){ to[m.to]=(to[m.to]||0)+1; from[m.from]=(from[m.from]||0)+1; } });

/* ================= YouTube 播放區 ================= */
function ytId(s){ s=String(s||'').trim(); if(!s) return ''; var m=s.match(/(?:v=|youtu\.be\/|\/live\/|\/embed\/|\/shorts\/)([A-Za-z0-9_-]{11})/); if(m) return m[1]; if(/^[A-Za-z0-9_-]{11}$/.test(s)) return s; return ''; }
function ytChannel(s){ s=String(s||'').trim(); var m=s.match(/(UC[A-Za-z0-9_-]{22})/); return m?m[1]:''; }
function loadYTApi(cb){ if(window.YT&&window.YT.Player){ cb(); return; } window.onYouTubeIframeAPIReady=cb; if(!document.getElementById('yt-api')){ var s=document.createElement('script'); s.id='yt-api'; s.src='https://www.youtube.com/iframe_api'; document.head.appendChild(s); } }

  var vars={autoplay:1, mute:1, playsinline:1, fs:0, rel:0, modestbranding:1, controls:1};
  if(demoVid()) vars.start=Math.floor(demoSeekT());

  loadYTApi(function(){
    var opt={width:'100%',height:'100%',playerVars:vars,events:{onReady:function(e){ S.ytReady=true; S.muted=true; try{ e.target.mute(); e.target.playVideo(); }catch(x){} var ub=document.getElementById("unmute"); if(ub) ub.style.display=""; demoSeek(); }}};
    if(id) opt.videoId=id; else { opt.playerVars.list=undefined; }

function toggleFull(){
  var v=document.getElementById('vwrap'); if(!v) return;
  var fsEl=document.fullscreenElement||document.webkitFullscreenElement;
  if(fsEl){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); return; }
  if(S.pseudo){ S.pseudo=false; v.classList.remove('pseudo'); return; }
  var req=v.requestFullscreen||v.webkitRequestFullscreen;
  if(req){ try{ var p=req.call(v); if(p&&p.catch) p.catch(function(){ pseudoFull(v); }); return; }catch(e){} }
  pseudoFull(v);   /* iPhone 不支援區塊全螢幕：用網頁撐滿畫面，彈幕和比分都保留 */
}

/* ===== 剛剛這球：直接讀紀錄系統最新一球的球種、進壘點、結果 ===== */
var RES_LBL={ball:['壞球','ball'],strike_look:['好球（看）','str'],strike_swing:['揮空','str'],foul:['界外','foul'],hbp:['觸身','ball']};
function zoneText(z){ if(z==null||isNaN(z)) return ''; z=+z; var r=Math.floor(z/5), c=z%5; if(r>=1&&r<=3&&c>=1&&c<=3) return '好球帶'+['偏高','中間','偏低'][r-1]; return '好球帶外'+(r===0?'・偏高':(r===4?'・偏低':'')); }
/* ===== 單球細節：進壘點、球種、擊球狀態、飛行狀態、落點、處理順序、最終結果 ===== */
var POSN={'1':'投手','2':'捕手','3':'一壘手','4':'二壘手','5':'三壘手','6':'游擊手','7':'左外野','8':'中外野','9':'右外野',P:'投手',C:'捕手','1B':'一壘手','2B':'二壘手','3B':'三壘手',SS:'游擊手',LF:'左外野',CF:'中外野',RF:'右外野'};
var FINAL_LBL={'1B':'一壘安打','2B':'二壘安打','3B':'三壘安打','HR':'全壘打','K':'三振','三振看':'三振（站著看）','三振揮':'三振（揮棒落空）','BB':'四壞球保送','HBP':'觸身球','SF':'高飛犧牲打','SH':'犧牲觸擊','ROE':'失誤上壘','FC':'野手選擇','GIDP':'雙殺打','DP':'雙殺','TP':'三殺'};
function zoneGridHTML(z){ var c=''; for(var k=0;k<25;k++){ var rr=Math.floor(k/5), cc=k%5; c+='<i class="'+(rr>=1&&rr<=3&&cc>=1&&cc<=3?'in':'')+(z!=null&&+z===k?' hit':'')+'"></i>'; } return '<div class="mz big">'+c+'</div>'; }
function fieldSVG(l){
  var dot=(l&&l.x!=null&&l.y!=null)?'<circle cx="'+(+l.x)+'" cy="'+(+l.y)+'" r="3.2" fill="#e0767b" stroke="#fff" stroke-width="1"/>':'';
  return '<svg class="fld" viewBox="0 0 100 100" aria-label="落點"><path d="M50 92 L4.7 46.7 A64 64 0 0 1 95.3 46.7 Z" fill="#20301f" stroke="#3b5a39" stroke-width="0.8"/>'+
    '<path d="M50 92 L60.2 81.8 L50 71.6 L39.8 81.8 Z" fill="#5a4630" stroke="#d9d3c8" stroke-width="0.5"/>'+
    '<circle cx="50" cy="81.8" r="1.6" fill="#8a7458"/>'+dot+'</svg>';
}
function pitchDetailHTML(ei){
  var g=(S.mode==='replay'&&S.replay&&S.replay.game)||S.cur, e=g&&g.events[ei]; if(!e) return '<h3>找不到這一球</h3>';
  var r=(S.model&&S.model.today||[]).find(function(x){ return x.ei===+ei; })||{};
  var n=0; for(var j=+ei;j>=0;j--){ var q=g.events[j]; if(q.type!=='pitch'&&q.type!=='battedball') continue; if(q.batterName!==e.batterName||q.inningBefore!==e.inningBefore||q.halfBefore!==e.halfBefore) break; n++; }
  var bat=e.batterName||'', pit=e.pitcherName||r.pit||'';
  var h='<h3>'+(e.inningBefore||'')+' 局'+(e.halfBefore==='top'?'上':'下')+'・'+esc(bat)+'</h3><div class="sub">投手 '+esc(pit||'—')+'・這個打席第 '+n+' 球・'+(e.ballsBefore!=null?e.ballsBefore+' 壞 '+e.strikesBefore+' 好':'')+(e.outsBefore!=null?'・'+e.outsBefore+' 出局':'')+'</div>';
  var kv=[];
  kv.push(['球種', e.pitchType||'未記錄']);
  var res;
  if(e.type==='battedball') res='打進場內'; else { res=(RES_LBL[e.pitchResult]||[e.pitchResult||'—'])[0]; }
  kv.push(['這球結果', res]);
  if(e.type==='battedball'){
    kv.push(['擊球狀態', e.power||'未記錄']);
    kv.push(['飛行狀態', e.trajectory||'未記錄']);
    var ch=(e.chain&&e.chain.length)?e.chain.map(function(c){ return (POSN[c.pos]||c.pos)+(c.error?'（失誤）':''); }).join(' → '):'';
    if(!ch&&e.chainStr) ch=String(e.chainStr).split('-').map(function(x){ return POSN[x]||x; }).join(' → ');
    kv.push(['處理順序', ch?(ch+(e.chainStr?'（'+e.chainStr+'）':'')):'未記錄']);
  }
  var fin=e.finalOutcome;
  if(fin){ var ft=FINAL_LBL[fin]||(fin==='一般出局'?((e.trajectory||'')+'出局'):fin); if(e.rbi) ft+='・打點 '+e.rbi; kv.push(['最終結果', ft]); }
  h+='<div class="pdgrid"><div class="pdzone">'+zoneGridHTML(e.zone)+'<small>進壘點（捕手視角）'+(e.zone!=null?'<br>'+esc(zoneText(e.zone)):'<br>未記錄')+'</small></div>'+
    (e.type==='battedball'?'<div class="pdzone">'+fieldSVG(e.landing)+'<small>落點'+(e.landing?'':'<br>未記錄')+'</small></div>':'')+'</div>';
  h+='<div class="kv pdkv">'+kv.map(function(x){ return '<div><div class="k">'+esc(x[0])+'</div><div class="v">'+esc(String(x[1]))+'</div></div>'; }).join('')+'</div>';
  h+='<div class="row" style="justify-content:flex-end">'+(S.sheet&&S.sheet.back?'<button class="btn" data-act="plogBack">‹ 回投手紀錄</button>':'')+'<button class="btn" data-act="close">關閉</button></div>';
  return h;
}
/* ===== 投手逐球紀錄：先選投手，再看逐局、逐打席、逐球；重播時點一球會跳到那一球 ===== */
function plogRecs(){ var R=S.replay; if(S.mode==='replay'&&R&&R.game){ if(!R.fullRecs){ try{ R.fullRecs=normGame(R.game).recs; }catch(e){ R.fullRecs=[]; } } return {recs:R.fullRecs, g:R.game, now:R.evN}; }
  return {recs:(S.model&&S.model.today)||[], g:S.cur, now:Infinity}; }
function plogPitchers(){ var P=plogRecs(), ours=[], opp=[], cnt={};
  P.recs.forEach(function(r){ if(!r.pit) return; cnt[r.pit]=(cnt[r.pit]||0)+1; var L=r.ourPit?ours:opp; if(L.indexOf(r.pit)<0) L.push(r.pit); });
  return {ours:ours, opp:opp, cnt:cnt}; }

}
function plogFinal(e){ return FINAL_LBL[e.finalOutcome]||(e.finalOutcome==='一般出局'?((e.trajectory||'')+'出局'):e.finalOutcome); }

/* ================= 事件 ================= */
document.addEventListener('click',function(ev){
  var t=ev.target.closest('[data-act]'); if(!t) return; var a=t.dataset.act;
  if(a==='send') send();
  else if(a==='secret') secretTap();
  else if(a==='demoToggle'){ if(S.mode==='demo') exitDemo(); else { startDemo(); toast('DEMO 模式'); } }
  else if(a==='mention') insertAt(t.dataset.name);
  else if(a==='atpick') pickAt(t.dataset.name);
  else if(a==='exitDemo') exitDemo();
  else if(a==='tab'){ S.tab=t.dataset.v; render(); if(S.tab==='chat'){ var b=document.getElementById('msgs'); b.scrollTop=b.scrollHeight; } }
  else if(a==='player'){ S.sheet={type:'player', name:t.dataset.name, view:null}; renderSheet(); }
  else if(a==='pstats'){ S.sheet.view='stats'; renderSheet(); }
  else if(a==='pback'){ S.sheet.view=null; renderSheet(); }
  else if(a==='rocket'){ var nm=t.dataset.name; S.sheet=null; renderSheet(); sendRocket(nm); }
  else if(a==='close'){ S.sheet=null; renderSheet(); }
  else if(a==='replays'){ showLanding('history'); }
  else if(a==='home'){ try{ history.replaceState(null,'',location.pathname); QS=new URLSearchParams(''); }catch(e){} S.cur=null; S.model=null; S.log=[]; S.seen={}; S.lastEvN=-1; S.demo=null; var ap=document.getElementById('app'); ap.dataset.built=''; S.yt=null; render(); showLanding(); }
  else if(a==='goLive'){ hideLanding(); var ap2=document.getElementById('app'); ap2.dataset.built=''; S.yt=null; startLive(); render(); }
  else if(a==='goHistory'){ S.landView='history'; renderLanding(); loadHistoryList(); }
  else if(a==='landMain'){ S.landView='main'; renderLanding(); }
  else if(a==='replays'&&false){ S.sheet={type:'replays'}; renderSheet(); fetch(fbBase()+'/replays.json').then(function(r){ return r.json(); }).then(function(o){ S.replayList=o||{}; if(S.sheet&&S.sheet.type==='replays') renderSheet(); }).catch(function(){ S.replayList={}; if(S.sheet&&S.sheet.type==='replays') renderSheet(); }); }
  else if(a==='openReplay'){ hideLanding(); var gid=t.dataset.gid; try{ var q=new URLSearchParams(location.search); q.set('replay',gid); q.delete('demo'); history.replaceState(null,'',location.pathname+'?'+q.toString()); QS=q; }catch(e){} startReplay(gid); }
  else if(a==='exitReplay'){ exitReplay(); }
  else if(a==='cam'){ camSwitch(+t.dataset.i, false); }
  else if(a==='rpJump'){ rpJumpEi(t.dataset.ei); }
  else if(a==='rpSeek'){ rpSeek(+t.dataset.d); }
  else if(a==='rpRate'){ var rs=[1,1.5,2]; S.rpRate=rs[(rs.indexOf(S.rpRate||1)+1)%rs.length]; try{ S.yt.setPlaybackRate(S.rpRate); }catch(e){} t.textContent=S.rpRate+'x'; rpFlash('速度 '+S.rpRate+'x', 0); }
  else if(a==='pdet'){ S.sheet={type:'pdet', ei:+t.dataset.ei}; renderSheet(); }
  else if(a==='plog'){ S.sheet={type:'plog'}; renderSheet(); }
  else if(a==='plogP'){ S.sheet={type:'plog', name:t.dataset.name}; renderSheet(); }
  else if(a==='plogPitch'){ var pn=S.sheet&&S.sheet.name; if(S.mode==='replay') rpJumpEi(t.dataset.ei); S.sheet={type:'pdet', ei:+t.dataset.ei, back:pn}; renderSheet(); }
  else if(a==='plogBack'){ S.sheet={type:'plog', name:S.sheet&&S.sheet.back}; renderSheet(); }
  else if(a==='bullpen'){ S.sheet={type:'bullpen'}; renderSheet(); }
  else if(a==='toggleOthers'){ S.othersOpen=!S.othersOpen; renderSide(); }
  else if(a==='sponsor'){ S.sheet={type:'support'}; renderSheet(); }
  else if(a==='supportP'){ S.sheet={type:'support', to:t.dataset.name}; renderSheet(); }
  else if(a==='spG'){ spCollect(); S.sheet.g=t.dataset.v; renderSheet(); spTierHint(); }
  else if(a==='spAmt'){ var ai=document.getElementById('sp-amt'); if(ai){ ai.value=t.dataset.v; spTierHint(); } }
  else if(a==='spNext'){ spNext(); }
  else if(a==='spStep'){ spCollect(); var sh0=S.sheet; if((sh0.step||1)===1&&!(sh0.name||'').trim()){ toast('請填名字或暱稱'); return; } sh0.step=(sh0.step||1)+1; renderSheet(); var f0=document.querySelector('.spf input'); if(f0) setTimeout(function(){ f0.focus(); },50); spTierHint(); }
  else if(a==='spPrev'){ spCollect(); S.sheet.step=Math.max(1,(S.sheet.step||1)-1); renderSheet(); }
  else if(a==='copyAcct'){ var acct=SPONSOR.acct.replace(/\D/g,''); (navigator.clipboard?navigator.clipboard.writeText(acct):Promise.reject()).then(function(){ toast('已複製帳號 '+acct); },function(){ toast('帳號：'+acct); }); }
  else if(a==='settings'){ S.sheet={type:'settings'}; renderSheet(); }
  else if(a==='stats'){ S.sheet={type:'stats'}; renderSheet(); }
  else if(a==='saveNick'){ var v=(document.getElementById('nick-in').value||'').trim().slice(0,12); if(!v) return; S.cfg.nick=v; saveJSON(CFG_KEY,S.cfg); S.sheet=null; renderSheet(); var ci=document.getElementById('chat-in'); if(ci) ci.placeholder='以「'+v+'」留言…'; var cb=nickCb; nickCb=null; if(cb) cb(); }
  else if(a==='saveCfg'){
    var oldYt=curYt(), oldSrc=wantSrc(); S.cfg.ytTest=document.getElementById('cf-yt').value.trim(); var nk=document.getElementById('cf-nick').value.trim().slice(0,12); S.cfg.nick=nk; var ci0=document.getElementById('chat-in'); if(ci0) ci0.placeholder=inPh();
    S.cfg.api=document.getElementById('cf-api').value.trim()||S.site.api||DEFAULT_API; saveJSON(CFG_KEY,S.cfg); S.sheet=null;
    if(oldYt!==curYt()){ var app=document.getElementById('app'); app.dataset.built=''; S.yt=null; }
    if(S.mode!=='demo') startLive();
    render();
  }
  else if(a==='mute') toggleMute();
  else if(a==='full') toggleFull();
  else if(a==='dm'){ S.dmOn=!S.dmOn; S.cfg.dm=S.dmOn; saveJSON(CFG_KEY,S.cfg); t.textContent=S.dmOn?'彈幕 開':'彈幕 關'; var cb2=document.getElementById('dm-tog'); if(cb2) cb2.checked=S.dmOn; if(!S.dmOn) document.getElementById('dm').innerHTML=''; }
  else if(a==='prev'&&S.demo&&S.demo.i>0){ if(S.autoTimer){ clearInterval(S.autoTimer); S.autoTimer=null; } S.demo.i--; S.lastEvN=-1; applyFrame(); }
  else if(a==='next'&&S.demo&&S.demo.i<S.demo.frames.length-1){ if(S.autoTimer){ clearInterval(S.autoTimer); S.autoTimer=null; } S.demo.i++; applyFrame(); }
  else if(a==='auto'){ if(S.autoTimer){ clearInterval(S.autoTimer); S.autoTimer=null; try{ if(S.yt&&S.yt.pauseVideo) S.yt.pauseVideo(); }catch(e){} render(); } else { if(S.demo&&S.demo.i>=S.demo.frames.length-1){ S.demo.i=0; S.lastEvN=-1; applyFrame(); try{ if(S.yt&&S.yt.seekTo) S.yt.seekTo(demoT(),true); }catch(e){} } startAuto(); } }
  else if(a==='bots'){ if(S.bots) stopBots(); else startBots(); render(); }
});
document.addEventListener('change',function(ev){ if(ev.target.id==='dm-tog'){ S.dmOn=ev.target.checked; S.cfg.dm=S.dmOn; saveJSON(CFG_KEY,S.cfg); var b=document.querySelector('[data-act="dm"]'); if(b) b.textContent=S.dmOn?'彈幕 開':'彈幕 關'; if(!S.dmOn) document.getElementById('dm').innerHTML=''; } });
document.addEventListener('keydown',function(ev){
  if(ev.target.id==='chat-in'&&!ev.isComposing&&atOpen()){ if(ev.key==='Enter'||ev.key==='Tab'){ var f=document.querySelector('#atpop button'); if(f){ ev.preventDefault(); pickAt(f.dataset.name); return; } } if(ev.key==='Escape'){ hideAt(); return; } }
  if(ev.key==='Enter'&&ev.target.id==='chat-in'&&!ev.isComposing){ ev.preventDefault(); send(); } if(ev.key==='Enter'&&ev.target.id==='nick-in'&&!ev.isComposing){ ev.preventDefault(); var b=document.querySelector('[data-act="saveNick"]'); if(b) b.click(); } });
document.addEventListener('fullscreenchange',function(){ /* 退出全螢幕時保持版面 */ });
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&S.mode==='live') pollOnce(); });
window.addEventListener('storage',function(e){ /* 備援：BroadcastChannel 不支援時，從 localStorage 補訊息 */
  if(bc||!S.cur||e.key!==logKey()) return; (loadJSON(logKey(),[])||[]).forEach(function(m){ receive(m,false); }); });

/* ================= 啟動 ================= */
loadPlayers(); loadSite(true).then(function(){ connectCfg(); presStart(); if(wantReplay()) startReplay(wantReplay()); else if(wantSrc()==='demo') startDemo(); else if(wantDirect()) startLive(); else { render(); showLanding(); } setInterval(function(){ if(!document.hidden) loadSite(false); }, 60000); });
})();
</script>
</body>
</html>
